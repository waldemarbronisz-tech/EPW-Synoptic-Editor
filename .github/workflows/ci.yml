name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Internal-audit fix: primary devs run this on Windows (START_EPW_SYNOPTIC.bat,
    # the .bat launcher, native file dialogs) but CI only ever exercised Ubuntu.
    # A matrix catches path-separator/case-sensitivity/line-ending issues the
    # single ubuntu-latest job never could.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test

    - name: Build
      run: npm run build
